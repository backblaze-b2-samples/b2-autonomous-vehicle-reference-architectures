architectures:
  - id: drive-log-offload-ingest
    name: Offload drive logs from vehicles and depots into a versioned raw zone
    slug: drive-log-offload-ingest
    summary: Upload closed rosbag2/MCAP log splits from vehicles, depot ingest stations, or shipped drives into a versioned B2 raw zone, verify each split before deleting the local copy, send only trigger-flagged event windows over the air, and start downstream extraction from object-created events.
    audience:
      - AV data infrastructure and fleet operations engineers
      - Vehicle software engineers who own on-vehicle logging
      - Security and storage architects
    problem: Test vehicles continuously record synchronized sensor data in bounded log splits. Offload must never lose a split, keep long-lived credentials off vehicles, keep every version recoverable for audit, notify the pipeline without polling, move years of historic logs, and let engineers preview a drive soon after it lands.
    workflow:
      - Record synchronized sensor topics with rosbag2 (MCAP storage) and close a split every N GB or N minutes
      - Upload only trigger-flagged event windows over cellular; hold full splits for depot Wi-Fi or a drive swap
      - Request short-lived presigned PUT or multipart part URLs from a fleet API for raw/<date>/<vehicle>/<drive_id>/
      - Record the upload version ID; an ingest verifier compares the stored bytes with the source size and SHA-256 before acknowledging local deletion
      - Sync depot ingest stations and shipped drives with rclone or s5cmd using a write-only key scoped to raw/; seed large backfills with Fireball
      - Verify signed Event Notifications, check completeness, and mark failed splits as quarantined in the metadata database with a marker object under quarantine/
      - Record the drive/session row in the metadata database and export a Parquet copy under catalog/
      - Index recordings for triage with a self-hosted Foxglove Edge Site
      - Server-side copy incident splits to an Object Lock bucket under legal hold
    capabilities:
      - S3-compatible API
      - Presigned PUT (5 GB single-PUT limit) and presigned multipart part uploads
      - Scoped application keys (write-only ingest key limited to raw/)
      - Event Notifications (prefix-filtered, signed webhook)
      - Server-side copy
      - Object Lock and legal hold
      - Lifecycle rules, including cleanup of unfinished multipart uploads
      - SSE-B2 encryption
      - Backblaze Fireball bulk ingest
    integrations:
      - id: rclone
        name: rclone
        role: Bulk copy and sync of drive-log folders from depot NAS or ingest stations
        connection: Native Backblaze B2 backend (type = b2) with a write-only key scoped to raw/; the S3 backend with the B2 endpoint also works
        connection_type: native-b2-option
        url: https://rclone.org/b2/
        setup_url: https://www.backblaze.com/docs/cloud-storage-integrate-rclone-with-backblaze-b2
      - id: s5cmd
        name: s5cmd
        role: High-parallelism bulk upload and sync from depot ingest stations
        connection: Copy closed splits from local disk with --endpoint-url (or S3_ENDPOINT_URL) set to https://s3.<region>.backblazeb2.com and the depot's write-only key; size --numworkers, cp --concurrency, and --part-size to the depot uplink
        connection_type: s3-sync-cli
        url: https://github.com/peak/s5cmd
        setup_url: https://github.com/peak/s5cmd#readme
      - id: foxglove-edge-site
        name: Foxglove Edge Site (self-hosted)
        role: Recording indexing, preview, and engineer triage near the data
        connection: recordingStorage.provider=s3_compatible with recordingStorage.s3CompatibleServiceUrl set to the B2 S3 endpoint and an HMAC key pair in the recording-storage-credentials secret; set recordingStorage.s3CompatibleServiceRegion to the bucket region
        connection_type: s3-custom-endpoint
        url: https://docs.foxglove.dev/docs/data/edge-sites/installation
    prerequisites:
      - Private raw and evidence buckets in the same B2 region; the evidence bucket created with Object Lock enabled
      - A fleet API that holds a raw/-scoped writer key server-side and issues presigned URLs to authenticated vehicles
      - A write-only application key per depot, scoped to the raw bucket and raw/ prefix
      - An HTTPS webhook receiver and queue for B2 Event Notifications
      - A transactional metadata database for drives, sessions, and object keys
    expected_scale:
      profile: Fleet recording rates, logging hours, and retention determine the raw corpus size
      notes: Depot uplink bandwidth and upload concurrency usually bound ingest; measure before considering Overdrive, and use Fireball for historic backfills.
    security_considerations:
      - Vehicles never hold application keys; they receive presigned URLs scoped to one object key with short expiry
      - The fleet API key has writeFiles only on raw/; upload responses, not HeadObject, confirm completion
      - writeFiles keys can hide or supersede raw files; versions stay recoverable, and default governance retention on the raw bucket adds immutability where the program requires it
      - Depot keys are write-only (writeFiles, listFiles at most) and scoped to raw/
      - Verify the X-Bz-Event-Notification-Signature HMAC and make consumers idempotent
      - Keep Object Lock and legal-hold credentials out of ingest services
    compliance_considerations:
      - Raw camera data contains faces and license plates; restrict raw/ readers and anonymize before labeling
      - Set incident retention and legal holds from safety-case and litigation requirements; compliance mode cannot be shortened
      - Record data residency for the bucket region and for any Foxglove control-plane metadata
    links:
      architecture: architectures/drive-log-offload-ingest/architecture.md
      deployment: https://www.backblaze.com/docs/cloud-storage-integrate-rclone-with-backblaze-b2

  - id: sensor-lake-scenario-mining
    name: Decode drive logs into a queryable sensor lake and mine long-tail scenarios
    slug: sensor-lake-scenario-mining
    summary: Extract raw logs into per-topic Parquet/Iceberg tables and frame blobs on B2, query them in place with Spark, Trino, or DuckDB, find rare scenarios with embedding search over keyframes, and freeze results as versioned scenario-set manifests.
    audience:
      - AV data platform and data lake engineers
      - Perception and validation engineers who mine scenarios
      - Analytics engineers
    problem: Raw logs are not searchable. Engineers need SQL over billions of frame and event rows and semantic search over camera clips without copying petabytes of blobs into a warehouse or running a permanent cluster.
    workflow:
      - Read raw splits with range GETs using the MCAP chunk index; decode and time-synchronize topics
      - Write extracted/<topic>/ Parquet and frame blobs with lineage back to the source split
      - Register Apache Iceberg tables under warehouse/ in a separate SQL or REST catalog
      - Run rule-based scene detectors in Spark or Trino; use DuckDB for ad hoc analyst queries
      - Embed keyframes and store a LanceDB table and ANN index under embeddings/
      - Write query results as immutable scenarios/<set>/<version>/manifest.json
      - Serve previews with short-lived presigned GET URLs
    capabilities:
      - S3-compatible API
      - Range GETs (MCAP chunk-indexed reads)
      - Presigned GET URLs for previews
      - Scoped application keys per zone (read-only raw/, read-write extracted/ and warehouse/)
      - Object versioning and lifecycle rules
      - SSE-B2 encryption
    integrations:
      - id: apache-spark-s3a
        name: Apache Spark (Hadoop S3A)
        role: Log decoding, extraction, and large-scale scene detection
        connection: fs.s3a.endpoint=https://s3.<region>.backblazeb2.com with fs.s3a.endpoint.region and fs.s3a.path.style.access=true, plus per-bucket endpoint and credential overrides for the raw and lake buckets
        connection_type: s3-custom-endpoint
        url: https://hadoop.apache.org/docs/stable/hadoop-aws/tools/hadoop-aws/index.html
        setup_url: https://hadoop.apache.org/docs/current/hadoop-aws/tools/hadoop-aws/third_party_stores.html
      - id: trino
        name: Trino
        role: Interactive SQL over Iceberg, Hive, or Delta tables on B2
        connection: Native S3 file system (fs.s3.enabled=true) with s3.endpoint set to B2, s3.region set to the bucket region, and s3.path-style-access=true in each Iceberg, Hive, or Delta Lake catalog
        connection_type: s3-custom-endpoint
        url: https://trino.io/
        setup_url: https://trino.io/docs/current/object-storage/file-system-s3.html
      - id: duckdb-httpfs
        name: DuckDB (httpfs)
        role: Ad hoc analyst queries over Parquet in place
        connection: S3 secret with ENDPOINT set to the B2 host name (s3.<region>.backblazeb2.com, no scheme), REGION, URL_STYLE 'path', and a read-only lake key
        connection_type: s3-custom-endpoint
        url: https://duckdb.org/docs/current/core_extensions/httpfs/s3api.html
      - id: pyiceberg
        name: Apache Iceberg (PyIceberg)
        role: Table format for extracted sensor and event tables
        connection: FileIO s3.endpoint set to the B2 endpoint and s3.region to the bucket region; run the SQL or REST catalog separately
        connection_type: s3-custom-endpoint
        url: https://py.iceberg.apache.org/configuration/
      - id: lancedb
        name: LanceDB / Lance
        role: Keyframe embedding table and ANN index stored next to the media
        connection: Use the pinned LanceDB 0.20.0 / pylance 0.23.2 connection profile in examples/lancedb.md, with the B2 endpoint, region and scoped credentials; serialize all table mutations through one writer service
        connection_type: s3-custom-endpoint
        url: https://lancedb.com/
        setup_url: https://github.com/lance-format/lance/blob/v0.23.2/rust/lance-table/src/io/commit.rs
    prerequisites:
      - The raw zone from the drive-log offload architecture
      - A lake bucket with extracted/, warehouse/, embeddings/, and scenarios/ prefixes
      - An Iceberg catalog service (SQL, REST, Nessie, or Polaris) outside B2
      - Spark, Trino, or Ray compute with local NVMe scratch
    expected_scale:
      profile: Billions of frame and event rows; millions of keyframe embeddings; petabytes of referenced blobs
      notes: Query engines read Parquet footers and row groups with range GETs. Size Parquet files and row groups to avoid many tiny requests; consider Overdrive only when sustained scan throughput, not compute, is the bottleneck.
    security_considerations:
      - Extraction jobs hold three keys (read-only raw/, extract-writer on extracted/, and iceberg-writer on warehouse/) because a key has one name prefix
      - Analyst DuckDB sessions use a read-only key scoped to the lake bucket, never raw/
      - Treat preview URLs as bearer credentials with short expiry
    compliance_considerations:
      - Extracted camera frames inherit the privacy classification of raw data
      - Preserve lineage from every table row and scenario manifest to its source split
    links:
      architecture: architectures/sensor-lake-scenario-mining/architecture.md
      deployment: https://trino.io/docs/current/object-storage/file-system-s3.html

  - id: multisensor-labeling
    name: Anonymize, pre-label, and annotate camera and LiDAR frames, then publish versioned label sets
    slug: multisensor-labeling
    summary: Blur faces and license plates in selected camera frames, run model-assisted 2D and 3D pre-labeling, have humans refine labels in tools that read media from B2 directly or through presigned URLs, and write versioned label releases back to B2.
    audience:
      - AV labeling operations and data quality teams
      - Perception engineers who own label taxonomies
      - Privacy, security, and storage architects
    problem: Labeling campaigns cover tens of thousands to millions of synchronized LiDAR sweeps and multi-camera frames. Copying them into each vendor's storage adds cost, delay, and privacy risk, and label exports need versioning tied to the scenario set they came from.
    workflow:
      - Select frames, LiDAR sweeps, calibration, and ego-pose from a frozen scenario manifest
      - Write face- and plate-blurred copies to anonymized/<campaign>/
      - Write pre-labels from 3D detectors, SAM 2, and trackers to prelabels/<campaign>/
      - Attach the bucket to CVAT or Label Studio as S3-compatible storage, or register presigned URLs with Segments.ai or Encord
      - Run QA and dataset slicing in FiftyOne Enterprise against the same bucket
      - Export annotations to labels/<campaign>/<version>/ and write the checksummed manifest last
      - Start validation and dataset assembly from the manifest's Event Notification
    capabilities:
      - S3-compatible API
      - Presigned GET URLs and bucket CORS rules for browser labeling tools
      - Scoped application keys (read-only anonymized/ for labeling tools, write-only labels/)
      - Event Notifications
      - Object versioning
      - SSE-B2 encryption
    integrations:
      - id: cvat
        name: CVAT
        role: 2D and 3D (point cloud) annotation and review
        connection: Attach cloud storage with the Amazon S3 provider, the required Endpoint URL set to the B2 endpoint, and a read-only key scoped to anonymized/
        connection_type: s3-custom-endpoint
        url: https://docs.cvat.ai/docs/workspace/attach-cloud-storage/
        setup_url: https://www.backblaze.com/docs/cloud-storage-connect-backblaze-b2-cloud-storage-to-cvat
      - id: label-studio
        name: Label Studio
        role: Image, video, and multimodal annotation with separate source and target storage
        connection: Amazon S3 source and target storage with the S3 Endpoint field set to the B2 endpoint; a read-only key on anonymized/ for source and a separate writer on labels/ for target
        connection_type: s3-custom-endpoint
        url: https://labelstud.io/guide/storage_s3
      - id: segments-ai
        name: Segments.ai
        role: Multi-sensor (camera and LiDAR) labeling by a managed workforce
        connection: Customer-secured URLs; your service signs B2 GET URLs with a read-only anonymized/ key and registers them on samples, refreshing open samples before the 7-day SigV4 maximum
        connection_type: presigned-url
        url: https://docs.segments.ai/how-to-integrate/import-data
      - id: encord
        name: Encord
        role: Managed 2D, video, and multi-sensor annotation over customer-hosted media
        connection: Direct Access integration; register files with a JSON whose objectUrl values are presigned B2 GET URLs signed by your service, add bucket CORS for the Encord origin, and re-sign before the 7-day SigV4 maximum. Encord's S3-compatible (MinIO) integration is the alternative when Encord may hold a read-only key and sign URLs itself
        connection_type: presigned-url
        url: https://docs.encord.com/platform-documentation/General/annotate-data-integrations/annotate-direct-access-integration
      - id: fiftyone-enterprise
        name: FiftyOne Enterprise
        role: Label QA, error mining, and dataset slicing
        connection: MinIO credentials profile (MINIO_ENDPOINT_URL or an ini endpoint_url) set to the B2 endpoint, plus region and a read-only key; media paths use the endpoint as their prefix
        connection_type: s3-custom-endpoint
        url: https://docs.voxel51.com/enterprise/installation.html
    prerequisites:
      - A labeling bucket with anonymized/, prelabels/, and labels/ prefixes, separate from raw data
      - An anonymization job with read access to raw/ and write access to anonymized/
      - Bucket CORS rules naming each labeling tool's exact origin
      - Each labeling tool's database, queues, and caches on block storage
    expected_scale:
      profile: Tens of thousands to millions of synchronized LiDAR sweeps and multi-camera frames per campaign
      notes: Annotator latency depends on the labeling tool and browser path, not Overdrive. Pre-label and anonymization jobs are throughput-bound GPU batch work.
    security_considerations:
      - Labeling tool keys read only anonymized/ and prelabels/, never raw/
      - Label export keys write only to labels/<campaign>/
      - CORS allows exact tool origins, not *
      - Presigned URLs given to external vendors are bearer credentials; keep expiry to the labeling window
    compliance_considerations:
      - Anonymize faces and license plates before any external labeling workforce sees frames (GDPR and similar regimes)
      - Record the anonymization model version and parameters in the label release manifest
      - Keep vendor contracts aligned with where URLs and label exports are stored
    links:
      architecture: architectures/multisensor-labeling/architecture.md
      deployment: https://www.backblaze.com/docs/cloud-storage-connect-backblaze-b2-cloud-storage-to-cvat

  - id: perception-training-data-checkpoints
    name: Version perception datasets, stream them to training, and track checkpoints
    slug: perception-training-data-checkpoints
    summary: Freeze labeled scenarios into immutable dataset versions (manifests plus shards) on B2, pin them with lakeFS or DVC, stream shards directly into training, and persist Ray Train checkpoints and MLflow run artifacts to B2.
    audience:
      - Perception ML engineers
      - ML platform and MLOps engineers
      - Safety and audit teams who trace models to data
    problem: Perception datasets range from tens of terabytes to petabytes and change constantly. Teams need reproducible versions that tie each model to its drives, labels, and splits, streaming without full local copies, and durable checkpoints for multi-node runs.
    workflow:
      - Assemble nuScenes/KITTI-style manifests and WebDataset or Parquet shards into datasets/<name>/<version>/, manifest last
      - Commit the version on a lakeFS branch over the B2 blockstore, or pin manifests in git with a DVC S3 remote
      - Stream shards to Ray Train or PyTorch workers with per-worker S3 GETs and local NVMe only as cache
      - Persist Ray Train checkpoints to s3://<bucket>/checkpoints/<run> with endpoint_override
      - Log metrics, evaluation reports, and registered models to an MLflow b2:// artifact store
      - Server-side copy released datasets and models to an Object Lock bucket; expire intermediate checkpoints by lifecycle sized above the longest run plus resume window
    capabilities:
      - S3-compatible API
      - High-concurrency streaming GETs
      - Multipart upload for large checkpoints
      - Scoped application keys (read-only datasets/ for training, write-only checkpoints/)
      - Server-side copy
      - Object Lock for released datasets and models
      - Lifecycle rules for intermediate checkpoints
      - Presigned URLs for dataset delivery to partners
    integrations:
      - id: ray
        name: Ray (Train)
        role: Distributed training with checkpoints and run state persisted to B2
        connection: Set RunConfig storage_path to an s3:// URI with endpoint_override=https://s3.<region>.backblazeb2.com, or set AWS_ENDPOINT_URL_S3 with a plain s3:// path
        connection_type: s3-custom-endpoint
        url: https://docs.ray.io/en/latest/train/user-guides/persistent-storage.html
      - &mlflow
        id: mlflow
        name: MLflow
        role: Experiment tracking, per-build evaluation runs, and model registry artifacts
        connection: Native b2://<bucket>@<endpoint-host>/<path> artifact store, or an s3:// artifact root with MLFLOW_S3_ENDPOINT_URL set to the B2 endpoint; use proxied artifact access so only the tracking server holds the key
        connection_type: native-b2-option
        url: https://mlflow.org/docs/latest/self-hosting/architecture/artifact-store/
        setup_url: https://www.backblaze.com/docs/cloud-storage-connect-backblaze-b2-to-mlflow
      - id: lakefs
        name: lakeFS
        role: Git-style branches and commits over dataset versions
        connection: Blockstore type s3 with blockstore.s3.endpoint set to the B2 endpoint, blockstore.s3.force_path_style=true, and the bucket region
        connection_type: s3-custom-endpoint
        url: https://docs.lakefs.io/reference/configuration/
        setup_url: https://www.backblaze.com/docs/cloud-storage-lakefs-integration-with-backblaze-b2
      - id: dvc
        name: DVC
        role: Pin dataset manifests and shards to git commits
        connection: S3 remote (dvc remote add) with endpointurl set to the B2 endpoint and credentials stored with --local
        connection_type: s3-custom-endpoint
        url: https://doc.dvc.org/user-guide/data-management/remote-storage/amazon-s3
    prerequisites:
      - A datasets bucket and a checkpoints bucket, plus an Object Lock bucket for released datasets and models
      - A lakeFS metadata database or a git repository for DVC pointers
      - An MLflow tracking server with its own database
      - GPU nodes with local NVMe for shard caching
    expected_scale:
      profile: Tens of terabytes to petabytes per dataset; multi-node GPU training reading shards in parallel
      notes: Shard size and per-worker concurrency determine throughput. Measure GPU utilization with Standard B2 first; evaluate Overdrive when sustained read throughput is the proven bottleneck.
    security_considerations:
      - Training jobs read datasets/ with a read-only key and write only to checkpoints/
      - Release publication and Object Lock credentials stay outside training clusters; the publisher key covers the source and release buckets for server-side copy
      - Partner dataset delivery uses presigned URLs from a read-only key scoped to one dataset version
    compliance_considerations:
      - Each dataset manifest records source drives, label versions, anonymization version, and splits
      - Locked dataset and model releases support safety-case lineage audits; set retention from program requirements
    links:
      architecture: architectures/perception-training-data-checkpoints/architecture.md
      deployment: https://docs.ray.io/en/latest/train/user-guides/persistent-storage.html

  - id: simulation-resim-evaluation
    name: Re-simulate real drives and synthetic scenarios against each stack build and keep comparable KPIs
    slug: simulation-resim-evaluation
    summary: Store scenario definitions and a frozen regression suite on B2, replay real log splits to re-sim workers from presigned URLs, write simulator episodes back to B2, and keep per-build KPI results immutable and comparable across releases.
    audience:
      - Simulation and validation engineers
      - AV stack release and CI owners
      - Safety-case and audit teams
    problem: Every stack release must be checked against thousands of real and synthetic scenarios. Re-sim needs fast read access to raw splits without copying them or giving workers broad keys, simulator output is terabyte-scale per run, and results must be reproducible and auditable per build.
    workflow:
      - Version scenario configs (OpenSCENARIO or CARLA/ScenarioRunner) and a regression-suite manifest on B2
      - Trigger a run from CI and fan scenarios out to re-sim and simulator workers with an orchestrator such as Ray Core (no B2 connection of its own)
      - Give re-sim workers presigned GET URLs for raw splits; pull or range-read to local NVMe and replay with ros2 bag play
      - Write synthetic episodes to sim/episodes/<build>/<scenario>/<id>/
      - Write per-run KPIs as Parquet under sim/results/<build>/ and log them to MLflow per build
      - Copy release-candidate results to an Object Lock bucket as safety-case evidence; expire bulk synthetic frames
      - Promote curated synthetic episodes into training datasets
    capabilities:
      - S3-compatible API
      - Presigned GET URLs (maximum 7-day expiry) for replay manifests
      - Range GETs
      - Scoped application keys (read-only raw/ held by the orchestrator to sign URLs, write-only sim/ for workers)
      - Object Lock for release-candidate evaluation results
      - Lifecycle rules for bulk synthetic frames
    integrations:
      - *mlflow
    prerequisites:
      - The raw zone and scenario manifests from the offload and scenario-mining architectures
      - A sim bucket for episodes and results, and an Object Lock evidence bucket
      - A CI system, scheduler, and simulator GPU servers outside B2
      - An MLflow tracking server
    expected_scale:
      profile: Thousands of scenarios per build; terabytes of simulator output per run
      notes: Re-sim reads whole splits once per scenario; synthetic writes are bursty. Expire bulk synthetic frames and keep KPI tables small and permanent.
    security_considerations:
      - Re-sim workers receive presigned GET URLs, not raw/ read keys
      - Simulator and re-sim workers write only to sim/ with a write-only key
      - Only the release pipeline can copy into the Object Lock evidence bucket, with one publisher key covering the sim and evidence buckets
    compliance_considerations:
      - Results for each release candidate stay locked for the safety-case retention period
      - Record build ID, scenario-set version, and simulator version with every result table
    links:
      architecture: architectures/simulation-resim-evaluation/architecture.md
      deployment: https://www.backblaze.com/docs/cloud-storage-connect-backblaze-b2-to-mlflow

samples:
  - id: rosbag2-cloud-offload
    name: Rosbag2 Cloud Offload
    url: https://github.com/backblaze-b2-samples/rosbag2-cloud-offload
    group: workflow
    summary: Presigned-PUT offload of closed rosbag2 splits with head_object verification before local delete, a Parquet session catalog, and a presigned-GET replay manifest
    description: Uploads closed rosbag2 splits with presigned PUT URLs, deletes the local copy only after head_object confirms the upload, builds a Parquet session catalog, and emits a presigned-GET replay manifest. It is a robot-scale demo of the B2-side pattern, not a fleet logger.
    architectures:
      - drive-log-offload-ingest
      - simulation-resim-evaluation
  - id: roboflow-inference-frame-archive
    name: Roboflow Inference Frame Archive
    url: https://github.com/backblaze-b2-samples/roboflow-inference-frame-archive
    group: workflow
    summary: Edge inference that archives only flagged frames and predictions to B2 with Parquet roll-ups
    description: Runs edge inference and archives only flagged frames and their predictions to B2, with Parquet roll-ups. It is an analogue of trigger-based event upload from a vehicle.
    architectures:
      - drive-log-offload-ingest
  - id: clip-video-scene-search
    name: CLIP Video Scene Search
    url: https://github.com/backblaze-b2-samples/clip-video-scene-search
    group: workflow
    summary: PySceneDetect segmentation and OpenCLIP text/image scene search over a FAISS index stored on B2
    description: Segments video with PySceneDetect, embeds scenes with OpenCLIP, and stores a FAISS index on B2 for text or image scene search.
    architectures:
      - sensor-lake-scenario-mining
  - id: yolo-drone-footage-detection
    name: YOLO Drone and Dashcam Footage Detection
    url: https://github.com/backblaze-b2-samples/yolo-drone-footage-detection
    group: workflow
    summary: Multipart upload of dashcam or drone video, YOLO detection on keyframes, and GPS-correlated GeoJSON detections on B2
    description: Multipart-uploads dashcam or drone video, runs YOLO detection on keyframes, and writes detections correlated with the GPS track as GeoJSON to B2.
    architectures:
      - sensor-lake-scenario-mining
  - id: sam2-mask-dataset-builder
    name: SAM 2 Mask Dataset Builder
    url: https://github.com/backblaze-b2-samples/sam2-mask-dataset-builder
    group: workflow
    summary: SAM 2 mask propagation across video, written to B2 as versioned COCO RLE segmentation datasets
    description: Propagates SAM 2 masks across video and writes them to B2 as versioned COCO RLE segmentation datasets; a pre-label pattern for camera frames.
    architectures:
      - multisensor-labeling
  - id: bytetrack-dataset-builder
    name: ByteTrack Dataset Builder
    url: https://github.com/backblaze-b2-samples/bytetrack-dataset-builder
    group: workflow
    summary: Versioned MOT tracking datasets built from raw video on B2
    description: Builds versioned multi-object tracking (MOT) datasets from raw video on B2; a tracking pre-label pattern.
    architectures:
      - multisensor-labeling
  - id: yolo11-batch-detection-pipeline
    name: YOLO11 Batch Detection Pipeline
    url: https://github.com/backblaze-b2-samples/yolo11-batch-detection-pipeline
    group: workflow
    summary: Batch 2D detection and segmentation over B2 image and video libraries producing COCO JSON pre-labels and crops
    description: Runs batch 2D detection and segmentation over B2 image and video libraries and writes COCO JSON pre-labels and crops back to B2.
    architectures:
      - multisensor-labeling
  - id: b2-event-broker
    name: B2 Event Broker
    url: https://github.com/backblaze-b2-samples/b2-event-broker
